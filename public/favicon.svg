<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pb-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131F38" />
      <stop offset="1" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="pb-ring" x1="12" y1="2" x2="52" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0.45" />
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="pb-card" x1="18" y1="12" x2="46" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE" stop-opacity="0.34" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="pb-tray" x1="12" y1="20" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BAE6FD" />
      <stop offset="0.45" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pb-flap" x1="16" y1="24" x2="48" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1325" />
      <stop offset="1" stop-color="#0F1B33" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pb-bg)" />
  <rect x="2.625" y="2.625" width="58.75" height="58.75" rx="14.375" stroke="url(#pb-ring)" stroke-width="1.25" />

  <!-- Layered archive card behind main tray -->
  <rect x="17" y="12.5" width="30" height="14" rx="4.5" fill="url(#pb-card)" stroke="#BAE6FD" stroke-opacity="0.32" stroke-width="1" />

  <!-- Primary sculpted mail-archive tray -->
  <rect x="12" y="20" width="40" height="30.5" rx="8.5" fill="url(#pb-tray)" />

  <!-- Crisp geometric envelope notch / archive slot -->
  <path
    d="M17.5 25.5L30.2 34.4C31.28 35.15 32.72 35.15 33.8 34.4L46.5 25.5"
    stroke="url(#pb-flap)"
    stroke-width="3.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="24" y="41.5" width="16" height="3" rx="1.5" fill="#0B1325" fill-opacity="0.72" />
</svg>
